# Server
server.port=8080
server.servlet.context-path=/api

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aurora_db}
spring.datasource.username=${DB_USERNAME:aurora}
spring.datasource.password=${DB_PASSWORD:aurora}
spring.datasource.driver-class-name=org.postgresql.Driver

# DataSource Security
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-expiration=3600000
jwt.refresh-expiration=86400000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# Authentication cookies
security.cookies.secure=${COOKIE_SECURE:false}
security.cookies.same-site=${COOKIE_SAME_SITE:Lax}

# Logging
logging.level.root=INFO
logging.level.com.aurora=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/aurora.log
logging.file.max-size=10MB
logging.file.max-history=10

# Security
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Java 21 Virtual Threads (Loom)
spring.threads.virtual.enabled=true

# Java 21 Garbage Collection
jdk.virtualThreadScheduler.parallelism=1000
jdk.virtualThreadScheduler.maxPoolSize=100000

# Project Loom
java.util.concurrent.ForkJoinPool.common.parallelism=256

# Spring Boot 3.2.0 Compatibility
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true