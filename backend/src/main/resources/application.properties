server.port=${PORT:8080}
server.servlet.context-path=/api
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aurora_db}
spring.datasource.username=${DB_USERNAME:aurora}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.threads.virtual.enabled=true

jwt.secret=${JWT_SECRET}
jwt.access-expiration=3600000
jwt.refresh-expiration=86400000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
security.cookies.secure=false
security.cookies.same-site=Lax
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
