# =====================================================
# Aurora School System - Development Profile
# =====================================================
# Este arquivo contém configurações específicas para ambiente de desenvolvimento
# Ative com: --spring.profiles.active=dev

# =====================================================
# SERVER CONFIGURATION
# =====================================================
server.port=8080
server.servlet.context-path=/api
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =====================================================
# DATABASE CONFIGURATION (Development)
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/aurora_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# DATABASE CONNECTION POOL (HikariCP)
# =====================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# =====================================================
# JPA / HIBERNATE CONFIGURATION (Development)
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# =====================================================
# JWT CONFIGURATION
# =====================================================
jwt.secret=aurora_secret_key_2024_development_base64_encoded_string_change_in_production
jwt.access-expiration=3600000
jwt.refresh-expiration=86400000

# =====================================================
# CORS CONFIGURATION
# =====================================================
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# =====================================================
# LOGGING CONFIGURATION (Development - Verbose)
# =====================================================
logging.level.root=INFO
logging.level.com.aurora=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.boot.actuate=DEBUG

# Log Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Arquivo de Log
logging.file.name=logs/aurora-dev.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.file.total-size-cap=100MB

# =====================================================
# SPRING BOOT ACTUATOR (Development)
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,threaddump,heapdump,env,configprops
management.endpoint.health.show-details=always
management.endpoint.health.show-components=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.export.prometheus.enabled=true

# =====================================================
# JAVA 21 VIRTUAL THREADS
# =====================================================
spring.threads.virtual.enabled=true
jdk.virtualThreadScheduler.parallelism=1000
jdk.virtualThreadScheduler.maxPoolSize=100000

# =====================================================
# ASYNC CONFIGURATION
# =====================================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.scheduling.pool.size=5

# =====================================================
# DEVTOOLS CONFIGURATION
# =====================================================
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.livereload.enabled=true

# =====================================================
# JACKSON CONFIGURATION (JSON)
# =====================================================
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# =====================================================
# ERROR HANDLING
# =====================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# =====================================================
# MVC CONFIGURATION
# =====================================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.mvc.static-path-pattern=/static/**

# =====================================================
# SESSIONS
# =====================================================
spring.session.store-type=none
server.servlet.session.timeout=30m

# =====================================================
# SECURITY
# =====================================================
spring.security.filter.order=5

# =====================================================
# APPLICATION INFO
# =====================================================
spring.application.name=Aurora School System
app.version=1.0.0
app.description=Sistema de Gerenciamento Escolar com Segurança Avançada
app.environment=DEVELOPMENT
app.java-version=21

# =====================================================
# DATABASE VERSIONING (Liquibase/Flyway - Optional)
# =====================================================
# spring.liquibase.enabled=false
# spring.flyway.enabled=false

# =====================================================
# CACHE CONFIGURATION (Optional)
# =====================================================
spring.cache.type=none

# =====================================================
# EMAIL CONFIGURATION (Optional - Para envio de emails)
# =====================================================
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=seu-email@gmail.com
# spring.mail.password=sua-senha-app
