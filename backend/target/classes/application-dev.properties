# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.starttls.required=true

# =====================================================
# MESSAGE QUEUE (Optional - Para RabbitMQ/Kafka)
# =====================================================
# spring.rabbitmq.host=localhost
# spring.rabbitmq.port=5672
# spring.rabbitmq.username=guest
# spring.rabbitmq.password=guest

# =====================================================
# MONITORING & METRICS
# =====================================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.health=health-check
management.endpoint.shutdown.enabled=false
management.health.defaults.enabled=true

# =====================================================
# PERFORMANCE TUNING (Development)
# =====================================================
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# =====================================================
# CUSTOM APPLICATION PROPERTIES
# =====================================================
app.max-failed-login-attempts=5
app.lockout-duration-minutes=15
app.jwt-algorithm=HS512
app.password-strength-enabled=true
app.audit-logging-enabled=true
app.rate-limiting-enabled=true
app.cors-enabled=true