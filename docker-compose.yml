services:
  aurora-postgres:
    image: postgres:16
    container_name: aurora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora}
      POSTGRES_DB: ${POSTGRES_DB:-aurora_db}
    ports:
      - "5432:5432"
    volumes:
      - aurora-postgres-data-v3:/var/lib/postgresql/data
      - ./database/supabase_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: aurora-backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://aurora-postgres:5432/aurora_db}
      DB_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-aurora}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-aurora}}
      JWT_SECRET: ${JWT_SECRET:-aurora_super_secret_key_2024_change_this_in_production_with_a_much_longer_string_for_hs512_algorithm_security_requirements_minimum_64_characters}
    ports:
      - "8080:8080"
    depends_on:
      aurora-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: aurora-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  aurora-postgres-data-v3:
