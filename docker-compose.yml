services:
  aurora-postgres:
    image: postgres:16
    container_name: aurora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-aurora_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aurora-postgres-data-v3:/var/lib/postgresql/data
      - ./database/supabase_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations:/aurora-migrations:ro
      - ./database/migrations/V001__chat_aluno_professor.sql:/docker-entrypoint-initdb.d/02-chat.sql:ro
      - ./database/migrations/V002__restringe_objetos_auxiliares.sql:/docker-entrypoint-initdb.d/03-permissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: aurora-backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://aurora-postgres:5432/${POSTGRES_DB:-aurora_db}}
      DB_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-aurora}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      aurora-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

  frontend:
    build:
      context: ./frontend
    container_name: aurora-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aurora-postgres-data-v3:
